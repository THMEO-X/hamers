<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamers</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e1116;
      color: #e6e9ef;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(420px, 90vw);
      padding: 32px;
      border: 1px solid #232a35;
      border-radius: 12px;
      background: #151a22;
    }
    h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 1px; }
    p.sub { margin: 0 0 24px; color: #8b95a5; font-size: 14px; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid #232a35;
      font-size: 15px;
    }
    .row span:first-child { color: #8b95a5; }
    .dot {
      display: inline-block;
      width: 9px; height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: #6b7280;
    }
    .on .dot { background: #22c55e; }
    .off .dot { background: #ef4444; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hamers</h1>
    <p class="sub">Trợ lý AI cho Discord</p>
    <div class="row" id="state-row"><span>Trạng thái</span><span id="state"><i class="dot"></i>Đang kiểm tra</span></div>
    <div class="row"><span>Thời gian chạy</span><span id="uptime">-</span></div>
    <div class="row"><span>Độ trễ</span><span id="ping">-</span></div>
  </main>

  <script>
    const fmt = (s) => {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${h} giờ ${m} phút`;
    };

    async function refresh() {
      const row = document.getElementById('state-row');
      const state = document.getElementById('state');
      try {
        const res = await fetch('/status', { cache: 'no-store' });
        const d = await res.json();
        row.className = 'row ' + (d.online ? 'on' : 'off');
        state.innerHTML = '<i class="dot"></i>' + (d.online ? 'Đang hoạt động' : 'Ngoại tuyến');
        document.getElementById('uptime').textContent = fmt(d.uptime);
        document.getElementById('ping').textContent = d.ping != null && d.ping >= 0 ? d.ping + ' ms' : '-';
      } catch {
        row.className = 'row off';
        state.innerHTML = '<i class="dot"></i>Không kết nối được';
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
